name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Wad Alreda AutoEdit
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          flutter create \
            --platforms=android \
            --org com.omer.autoedit \
            --project-name auto_edit \
            app

          rm -rf app/lib app/test

          mkdir -p app/lib app/test

          cp -R lib/. app/lib/
          cp -R test/. app/test/
          cp pubspec.yaml app/pubspec.yaml

          test -f app/lib/enhancer.dart
          test -f app/lib/editing_engine.dart
          test -f app/lib/motion_graphics.dart
          test -f app/lib/timeline_engine.dart
          test -f app/lib/sound_effect_generator.dart
          test -f app/test/editing_engine_test.dart
          test -f app/test/motion_graphics_test.dart
          test -f app/test/timeline_engine_test.dart
          test -f app/test/sound_effect_generator_test.dart

          cat > app/android/app/proguard-rules.pro <<'PROGUARD'
          -keep class androidx.work.** { *; }
          -keep class androidx.room.** { *; }
          -keep class * extends androidx.room.RoomDatabase { *; }
          -keep class androidx.work.impl.WorkDatabase_Impl { *; }
          -keep class com.unity3d.** { *; }
          -keep class com.arthenica.ffmpegkit.** { *; }
          -keep class com.antonkarpenko.ffmpegkit.** { *; }
          -dontwarn com.unity3d.**
          PROGUARD

          echo "Android project created."
          echo "Release rules restored."

      - name: Verify source-level Phase 3A integration
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          grep -q "import 'timeline_engine.dart';" lib/enhancer.dart
          grep -q "final motionPlan = MotionGraphicsPlan.forProfile" lib/enhancer.dart
          grep -q "_createTimelineProject(" lib/enhancer.dart
          grep -q "layersOfType(TimelineLayerType.caption)" lib/enhancer.dart
          grep -q "layersOfType(TimelineLayerType.title)" lib/enhancer.dart
          grep -q "layersOfType(TimelineLayerType.broll)" lib/enhancer.dart
          grep -q "required this.timelineProject" lib/enhancer.dart
          grep -q "static double durationFor(String style)" lib/sound_effect_generator.dart

          echo "Phase 3A source integration verified."

      - name: Validate Flutter manifest
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          data = Path("pubspec.yaml").read_text(encoding="utf-8")

          checks = {
              "package name": r"(?m)^name:\s*[A-Za-z0-9_]+\s*$",
              "dependencies": r"(?m)^dependencies:\s*$",
              "Flutter SDK": r"(?m)^  flutter:\s*$",
              "Dart SDK": r"(?m)^  sdk:\s*['\"]?>?=?\s*3\.",
          }

          for label, pattern in checks.items():
              if not re.search(pattern, data):
                  sys.exit(f"Invalid pubspec.yaml: missing {label}")

          print("Flutter manifest validated.")
          PY

      - name: Configure Android permissions and release
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
          """

          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  permissions + "\n    <application",
                  1
              )

          manifest.write_text(content, encoding="utf-8")
          PY

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle.kts

            cat >> android/app/build.gradle.kts <<'GRADLE'

          android {
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles("proguard-rules.pro")
                  }
              }
          }
          GRADLE

          elif [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle

            cat >> android/app/build.gradle <<'GRADLE'

          android {
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles 'proguard-rules.pro'
                  }
              }
          }
          GRADLE

          else
            echo "::error::Android app Gradle file not found."
            exit 1
          fi

          echo "Android release configuration restored."

      - name: Configure plugin compile SDK compatibility
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.gradle/init.d"

          cat > "$HOME/.gradle/init.d/force-sdk.gradle" <<'GRADLE'
          allprojects {
            afterEvaluate { project ->
              if (project.hasProperty('android') &&
                  project.plugins.hasPlugin('com.android.library')) {
                project.android.compileSdkVersion 36
              }
            }
          }
          GRADLE

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Format Dart files
        working-directory: app
        run: |
          dart format \
            lib \
            test

      - name: Analyze Dart code
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: app
        run: flutter test --no-pub

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --no-shrink

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Publish APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wad Alreda AutoEdit build ${{ github.run_number }}
          body: Android build with source-integrated Phase 3A keyframe timeline engine.
          files: app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}