name: filament_renderer
description: Native Android Filament engine bridge for Wad Alreda AutoEdit.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.omer.filament_renderer
        pluginClass: FilamentRendererPlugin
